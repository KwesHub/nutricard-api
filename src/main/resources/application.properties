spring.application.name=NutriCard

# PostgreSQL — Railway provides PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:nutricard_db}
spring.datasource.username=${PGUSER:eka}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Server port — Railway sets PORT env var
server.port=${PORT:8080}

# USDA FoodData Central API
usda.api.key=${USDA_API_KEY:your_key_here}

# CORS — set CORS_ORIGINS in production to your Vercel URL
cors.allowed.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

# Springdoc / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
